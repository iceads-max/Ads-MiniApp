<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ice Ads - Watch & Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #152238;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #10b981;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .user-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      color: var(--primary);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .balance-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .points {
      font-size: 44px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .ton-est {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 20px;
      font-weight: 500;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-ad {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);
    }
    .btn-ad:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .withdraw-box {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .withdraw-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .input-group input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background-color: #0b1329;
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    .input-group input:focus {
      border-color: var(--primary);
    }
    .btn-withdraw {
      background: #10b981;
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
    }
    .note {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 10px;
      text-align: center;
    }
    #statusMsg {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="user-badge" id="username">👤 Loading User...</div>

  <div class="card">
    <div class="balance-title">YOUR BALANCE</div>
    <div class="points" id="points">0</div>
    <div class="ton-est" id="tonEst">≈ 0.0000 TON</div>

    <button class="btn btn-ad" id="adBtn" onclick="watchAd()">
      🎬 Watch Ad (+10 Points)
    </button>
    <div id="statusMsg"></div>
  </div>

  <div class="withdraw-box">
    <div class="withdraw-title">
      <span>Withdraw to TON</span>
      <span style="font-size: 12px; color: var(--text-sub);">Min: 100 Points</span>
    </div>
    <div class="input-group">
      <input type="text" id="walletAddress" placeholder="Enter TON Wallet Address (EQ...)">
    </div>
    <button class="btn btn-withdraw" onclick="requestWithdraw()">
      💎 Request Payout
    </button>
    <div class="note">100 Points = 0.01 TON (Processed via Admin)</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // User Display
    const user = tg?.initDataUnsafe?.user;
    if (user) {
      document.getElementById("username").innerText = "👤 " + (user.first_name || "User");
    } else {
      document.getElementById("username").innerText = "👤 IceAds Player";
    }

    // Points Local Storage
    let points = parseInt(localStorage.getItem("ice_points") || "0");
    updateUI();

    function updateUI() {
      document.getElementById("points").innerText = points;
      const ton = (points * 0.0001).toFixed(4);
      document.getElementById("tonEst").innerText = `≈ ${ton} TON`;
      localStorage.setItem("ice_points", points);
    }

    function showStatus(text, color) {
      const msg = document.getElementById("statusMsg");
      msg.innerText = text;
      msg.style.color = color || "#94a3b8";
    }

    async function watchAd() {
      const btn = document.getElementById("adBtn");
      btn.disabled = true;
      btn.innerText = "⏳ Loading Ad...";
      showStatus("ကြော်ငြာ ခေါ်ယူနေပါသည်...", "#38bdf8");

      try {
        if (!window.Adsgram) {
          throw new Error("AdsGram SDK load မဖြစ်သေးပါ (Network စစ်ဆေးပါ)");
        }

        // AdsGram Initializer with Unit ID 57757
        const AdController = window.Adsgram.init({ blockId: "57757" });
        
        const result = await AdController.show();
        
        // ကြော်ငြာကြည့်ရှုမှု အောင်မြင်သည့်အခါ
        points += 10;
        updateUI();
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }
        showStatus("🎉 အောင်မြင်ပါသည်! +10 Points ရရှိပါပြီ။", "#10b981");
        if (tg?.showAlert) {
          tg.showAlert("🎉 +10 Points ရရှိပါသည်!");
        } else {
          alert("🎉 +10 Points ရရှိပါသည်!");
        }

      } catch (err) {
        console.error("AdsGram Error:", err);
        const errMsg = err?.description || err?.message || JSON.stringify(err);
        showStatus("⚠️ ကြော်ငြာမတက်ပါ: " + errMsg, "#ef4444");
        
        if (tg?.showAlert) {
          tg.showAlert("ကြော်ငြာ မရရှိနိုင်သေးပါ: " + errMsg);
        } else {
          alert("ကြော်ငြာ မရရှိနိုင်သေးပါ: " + errMsg);
        }
      } finally {
        btn.disabled = false;
        btn.innerText = "🎬 Watch Ad (+10 Points)";
      }
    }

    function requestWithdraw() {
      const address = document.getElementById("walletAddress").value.trim();
      if (points < 100) {
        const warning = "လက်ကျန် Points မလုံလောက်သေးပါ။ အနည်းဆုံး 100 Points ရှိရပါမည်။";
        tg?.showAlert ? tg.showAlert(warning) : alert(warning);
        return;
      }
      if (!address || address.length < 15) {
        const warning = "ကျေးဇူးပြု၍ မှန်ကန်သော TON Wallet Address ကို ရိုက်ထည့်ပါ။";
        tg?.showAlert ? tg.showAlert(warning) : alert(warning);
        return;
      }

      const success = "✅ ငွေထုတ်ယူခွင့် တောင်းဆိုမှု ပေးပို့ပြီးပါပြီ။ Admin ဘက်မှ အတည်ပြုပေးပါလိမ့်မည်။";
      tg?.showAlert ? tg.showAlert(success) : alert(success);
      points -= 100;
      updateUI();
      document.getElementById("walletAddress").value = "";
    }
  </script>
</body>
</html>
