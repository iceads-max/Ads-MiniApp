<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ice Ads - Watch & Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #152238;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      min-height: 100vh;
    }
    .user-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 16px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .balance-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .points {
      font-size: 40px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 2px;
    }
    .ton-est {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .daily-counter {
      font-size: 12px;
      color: var(--warning);
      margin-bottom: 14px;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-ad {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
    }
    .btn-ad:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .box {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }
    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 19, 41, 0.6);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .task-info {
      text-align: left;
    }
    .task-title {
      font-size: 14px;
      font-weight: 600;
    }
    .task-reward {
      font-size: 12px;
      color: var(--accent);
    }
    .btn-task {
      padding: 8px 14px;
      font-size: 13px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-task.done {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent);
      cursor: default;
    }
    .input-box {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0b1329;
      color: #fff;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }
    .btn-withdraw {
      background: #10b981;
      color: #fff;
    }
    #statusMsg {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="user-badge" id="username">👤 Loading...</div>

  <!-- Balance Card -->
  <div class="card">
    <div class="balance-title">YOUR BALANCE</div>
    <div class="points" id="points">0</div>
    <div class="ton-est" id="tonEst">≈ 0.0000 TON</div>
    <div class="daily-counter" id="dailyLimitText">Daily Ads: 0 / 100</div>

    <button class="btn btn-ad" id="adBtn" onclick="watchAd()">
      🎬 Watch Ad (+10 Points)
    </button>
    <div id="statusMsg"></div>
  </div>

  <!-- Tasks Section (Each task = 10 Points) -->
  <div class="box">
    <div class="section-title">
      <span>📌 Available Tasks</span>
    </div>
    <div id="taskList"></div>
  </div>

  <!-- Withdrawal Section -->
  <div class="box">
    <div class="section-title">
      <span>💎 Withdraw to TON</span>
      <span style="font-size: 11px; color: var(--text-sub);">Min: 100 Pts (0.01 TON)</span>
    </div>
    <input type="text" id="walletAddress" class="input-box" placeholder="Enter TON Wallet Address (EQ...)">
    <input type="number" id="withdrawPoints" class="input-box" placeholder="Points ပမာဏ ရိုက်ထည့်ပါ (Min: 100)">
    <button class="btn btn-withdraw" id="withdrawBtn" onclick="requestWithdraw()">Request Payout</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Config: 100 Points = 0.01 TON (1 Point = 0.0001 TON)
    const TON_RATE = 0.0001;
    const MIN_POINTS = 100; // 0.01 TON

    // Identifying Telegram User
    const user = tg?.initDataUnsafe?.user || { id: "DemoUser", first_name: "Member", username: "member" };
    document.getElementById("username").innerText = "👤 " + (user.first_name || "User");

    // Tasks List (Each Task gives 10 Points)
    let tasks = [
      { id: 1, title: "Join Official Telegram", reward: 10, link: "https://t.me/telegram" },
      { id: 2, title: "Subscribe Channel", reward: 10, link: "https://t.me/telegram" }
    ];
    let completedTasks = JSON.parse(localStorage.getItem("ice_completed_tasks") || "[]");

    // Balance & Daily Reset Logic
    let points = parseInt(localStorage.getItem("ice_points") || "0");
    const today = new Date().toISOString().split("T")[0];
    let dailyData = JSON.parse(localStorage.getItem("ice_daily") || "{}");

    if (dailyData.date !== today) {
      dailyData = { date: today, count: 0 };
      localStorage.setItem("ice_daily", JSON.stringify(dailyData));
    }

    updateUI();
    renderTasks();

    function updateUI() {
      document.getElementById("points").innerText = points;
      const tonVal = (points * TON_RATE).toFixed(4);
      document.getElementById("tonEst").innerText = `≈ ${tonVal} TON`;
      document.getElementById("dailyLimitText").innerText = `Daily Ads: ${dailyData.count} / 100`;
      localStorage.setItem("ice_points", points);
    }

    function renderTasks() {
      const container = document.getElementById("taskList");
      container.innerHTML = "";
      tasks.forEach(t => {
        const isDone = completedTasks.includes(t.id);
        const div = document.createElement("div");
        div.className = "task-item";
        div.innerHTML = `
          <div class="task-info">
            <div class="task-title">${t.title}</div>
            <div class="task-reward">+${t.reward} Points</div>
          </div>
          <button class="btn-task ${isDone ? 'done' : ''}" onclick="doTask(${t.id}, '${t.link}', ${t.reward})">
            ${isDone ? 'Claimed' : 'Start'}
          </button>
        `;
        container.appendChild(div);
      });
    }

    function doTask(id, link, reward) {
      if (completedTasks.includes(id)) return;
      if (tg) {
        tg.openLink(link);
      } else {
        window.open(link, "_blank");
      }
      setTimeout(() => {
        completedTasks.push(id);
        localStorage.setItem("ice_completed_tasks", JSON.stringify(completedTasks));
        points += reward;
        updateUI();
        renderTasks();
        tg?.showAlert ? tg.showAlert(`🎉 Task အောင်မြင်ပါသည်! +${reward} Points ရရှိပါသည်!`) : alert(`🎉 Task အောင်မြင်ပါသည်! +${reward} Points ရရှိပါသည်!`);
      }, 3000);
    }

    function showStatus(text, color) {
      const msg = document.getElementById("statusMsg");
      msg.innerText = text;
      msg.style.color = color || "#94a3b8";
    }

    async function watchAd() {
      if (dailyData.count >= 100) {
        const limitMsg = "ဒီနေ့အတွက် ကြော်ငြာကြည့်ရှုခွင့် အကြိမ် ၁၀၀ ပြည့်သွားပါပြီ။ မနက်ဖြန်တွင် ပြန်လည်ကြည့်ရှုပါ။";
        tg?.showAlert ? tg.showAlert(limitMsg) : alert(limitMsg);
        return;
      }

      const btn = document.getElementById("adBtn");
      btn.disabled = true;
      btn.innerText = "⏳ Loading Ad...";
      showStatus("ကြော်ငြာ ခေါ်ယူနေပါသည်...", "#38bdf8");

      try {
        if (!window.Adsgram) throw new Error("AdsGram SDK load မဖြစ်သေးပါ");

        // Active Unit ID: 57762
        const AdController = window.Adsgram.init({ blockId: "57762" });
        await AdController.show();

        points += 10;
        dailyData.count += 1;
        localStorage.setItem("ice_daily", JSON.stringify(dailyData));
        updateUI();

        tg?.HapticFeedback?.notificationOccurred('success');
        showStatus("🎉 အောင်မြင်ပါသည်!", "#10b981");
        tg?.showAlert ? tg.showAlert("🎉 +10 Points ရရှိပါသည်!") : alert("🎉 +10 Points ရရှိပါသည်!");

      } catch (err) {
        console.error("AdsGram Error:", err);
        const errMsg = err?.description || err?.message || "No Ad Available";
        showStatus("⚠️ " + errMsg, "#ef4444");
        tg?.showAlert ? tg.showAlert("ကြော်ငြာ အခြေအနေ: " + errMsg) : alert("ကြော်ငြာ အခြေအနေ: " + errMsg);
      } finally {
        btn.disabled = false;
        btn.innerText = "🎬 Watch Ad (+10 Points)";
      }
    }

    async function requestWithdraw() {
      const address = document.getElementById("walletAddress").value.trim();
      const amountInput = parseInt(document.getElementById("withdrawPoints").value);

      if (!address || address.length < 20) {
        const warning = "ကျေးဇူးပြု၍ မှန်ကန်သော TON Wallet Address အပြည့်အစုံ ရိုက်ထည့်ပါ။";
        tg?.showAlert ? tg.showAlert(warning) : alert(warning);
        return;
      }

      if (isNaN(amountInput) || amountInput < MIN_POINTS) {
        const warning = `အနည်းဆုံး ${MIN_POINTS} Points (0.01 TON) စတင် ထုတ်ယူရပါမည်။`;
        tg?.showAlert ? tg.showAlert(warning) : alert(warning);
        return;
      }

      if (amountInput > points) {
        const warning = `လက်ကျန် Points မလုံလောက်ပါ။ (လက်ကျန်: ${points} Pts)`;
        tg?.showAlert ? tg.showAlert(warning) : alert(warning);
        return;
      }

      const tonAmount = (amountInput * TON_RATE).toFixed(4);
      const btn = document.getElementById("withdrawBtn");
      btn.disabled = true;
      btn.innerText = "Processing...";

      // Telegram Bot API Integration (Admin Chat & Public Channel)
      const BOT_TOKEN = "7864388371:AAGB-YOUR_BOT_TOKEN"; // သင့် Bot Token ထည့်ပါ
      const ADMIN_ID = "9149192912";
      const CHANNEL_ID = "@YourChannelUsername"; // ငွေထုတ်ပြေစာ တင်မည့် Channel username (ဥပမာ @Iceads_payment)

      const receiptText = `🧾 <b>NEW WITHDRAWAL REQUEST</b>\n` +
                          `━━━━━━━━━━━━━━━━━━\n` +
                          `👤 <b>User:</b> ${user.first_name || 'Member'} (@${user.username || 'N/A'})\n` +
                          `🆔 <b>User ID:</b> <code>${user.id}</code>\n` +
                          `💰 <b>Amount:</b> ${amountInput} Points (<b>${tonAmount} TON</b>)\n` +
                          `🏦 <b>TON Address:</b>\n<code>${address}</code>\n` +
                          `📅 <b>Date:</b> ${new Date().toLocaleString()}\n` +
                          `━━━━━━━━━━━━━━━━━━\n` +
                          `Status: ⏳ Pending Admin Review`;

      try {
        // Send to Admin
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: ADMIN_ID, text: receiptText, parse_mode: "HTML" })
        });

        // Send to Channel
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: CHANNEL_ID, text: receiptText, parse_mode: "HTML" })
        });
      } catch (e) {
        console.log("Direct API Sent");
      }

      points -= amountInput;
      updateUI();
      document.getElementById("walletAddress").value = "";
      document.getElementById("withdrawPoints").value = "";
      btn.disabled = false;
      btn.innerText = "Request Payout";

      const success = `✅ ${tonAmount} TON ထုတ်ယူခွင့် ပြေစာအား Admin နှင့် Payment Channel သို့ ပေးပို့လိုက်ပါပြီ။`;
      tg?.showAlert ? tg.showAlert(success) : alert(success);
    }
  </script>
</body>
</html>
