<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Watch & Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
            margin: 0;
            user-select: none;
        }
        .user-box {
            font-size: 18px;
            margin-bottom: 15px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px 40px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .balance {
            font-size: 34px;
            font-weight: bold;
            color: #f1c40f;
            margin-top: 8px;
        }
        .btn {
            background: #2481cc;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 80%;
            max-width: 280px;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="user-box">မင်္ဂလာပါ <span id="username">User</span> 👋</div>
    <div class="card">
        <div>Your Balance</div>
        <div class="balance"><span id="points">0</span> Points</div>
    </div>

    <button class="btn" onclick="watchAd()">📺 Watch Ad (+10 Points)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let points = 0;
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById("username").innerText = user.first_name || "User";
        }

        // AdsGram Block ID ရလာပါက ဤနေရာတွင် အစားထိုးပါမည်
        const AdController = window.Adsgram?.init({ blockId: "57757" });

        function watchAd() {
            if (window.Adsgram) {
                AdController.show().then((result) => {
                    points += 10;
                    document.getElementById("points").innerText = points;
                    tg.HapticFeedback.notificationOccurred('success');
                }).catch((err) => {
                    // စမ်းသပ်ချိန် Ad ID မထည့်ရသေးပါက သတိပေးရန်
                    points += 10;
                    document.getElementById("points").innerText = points;
                    alert("Test Mode: +10 Points ရရှိပါသည် (Ad ID ချိတ်ဆက်ရန် ကျန်သေးသည်)");
                });
            } else {
                points += 10;
                document.getElementById("points").innerText = points;
            }
        }
    </script>
</body>
</html>
