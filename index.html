<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ice Ads - Watch & Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #152238;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px; min-height: 100vh; }
    .user-badge { background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.25); padding: 6px 14px; border-radius: 20px; font-size: 13px; color: var(--primary); margin-bottom: 16px; }
    .card { background-color: var(--card-bg); border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; text-align: center; margin-bottom: 16px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    .points { font-size: 40px; font-weight: 800; color: var(--primary); margin-bottom: 2px; }
    .ton-est { font-size: 14px; color: var(--accent); margin-bottom: 14px; }
    .daily-counter { font-size: 12px; color: var(--warning); margin-bottom: 14px; font-weight: 600; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:active { transform: scale(0.98); }
    .btn-ad { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; }
    .btn-ad:disabled { opacity: 0.5; }
    .box { width: 100%; max-width: 360px; background: var(--card-bg); border-radius: 18px; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 16px; }
    .btn-invite { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--primary); color: var(--primary); font-size: 14px; padding: 12px; margin-top: 10px; }
    .input-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background-color: #0b1329; color: #fff; font-size: 13px; margin-bottom: 10px; outline: none; }
    .btn-withdraw { background: #10b981; color: #fff; }
    #bannedScreen { display: none; text-align: center; padding: 40px 20px; }
  </style>
</head>
<body>

  <div id="bannedScreen">
    <h2 style="color: var(--danger); margin-bottom: 12px;">🚫 Access Denied</h2>
    <p style="color: var(--text-sub); font-size: 14px;">Your IP has been banned due to suspicious activity.</p>
  </div>

  <div id="mainApp" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    <div class="user-badge" id="username">👤 Loading...</div>

    <!-- Balance Card -->
    <div class="card">
      <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 4px;">YOUR BALANCE</div>
      <div class="points" id="points">0</div>
      <div class="ton-est" id="tonEst">≈ 0.0000 TON</div>
      <div class="daily-counter" id="dailyLimitText">Daily Ads: 0 / 100</div>

      <button class="btn btn-ad" id="adBtn" onclick="watchAd()">🎬 Watch Ad (+10 Points)</button>
    </div>

    <!-- Referral Section -->
    <div class="box">
      <div style="font-size: 15px; font-weight: 700; margin-bottom: 8px;">
        👥 Referral Program (<span id="refRewText">+20 Pts</span>)
      </div>
      <p style="font-size: 12px; color: var(--text-sub);">မိတ်ဆွေများကို ဖိတ်ခေါ်ပြီး Points များ ရယူပါ။</p>
      <button class="btn btn-invite" onclick="shareInviteLink()">🔗 Invite Friends</button>
    </div>

    <!-- Withdrawal Section -->
    <div class="box">
      <div style="font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between;">
        <span>💎 Withdraw to TON</span>
        <span id="minText" style="font-size: 11px; color: var(--text-sub);">Min: 100 Pts</span>
      </div>
      <input type="text" id="walletAddress" class="input-box" placeholder="TON Wallet Address (EQ...)">
      <input type="number" id="withdrawPoints" class="input-box" placeholder="Points အရေအတွက်">
      <button class="btn btn-withdraw" id="withdrawBtn" onclick="requestWithdraw()">Request Payout</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const RAW_SERVER = "http://132.243.30.37:5055";
    const ADMIN_USER_ID = "6093710107";

    let TON_RATE = 0.0001;
    let MIN_POINTS = 100;
    let DAILY_LIMIT = 100;
    let AD_REWARD = 10;
    let REF_REWARD = 20;

    const user = tg?.initDataUnsafe?.user || { id: 6093710107, first_name: "Member", username: "None" };
    document.getElementById("username").innerText = "👤 " + (user.first_name || "User");

    let points = 0;
    const today = new Date().toISOString().split("T")[0];
    let dailyData = JSON.parse(localStorage.getItem("ice_daily") || "{}");
    if (dailyData.date !== today) {
      dailyData = { date: today, count: 0 };
      localStorage.setItem("ice_daily", JSON.stringify(dailyData));
    }

    async function apiFetch(endpoint, options = {}) {
      const sep = endpoint.includes('?') ? '&' : '?';
      const targetUrl = RAW_SERVER + endpoint + `${sep}user_id=${user.id}`;
      try {
        const res = await fetch(targetUrl, options);
        return res;
      } catch (err) {
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(targetUrl);
        return await fetch(proxyUrl, options);
      }
    }

    async function loadData() {
      try {
        const res = await apiFetch(`/api/init_user`);
        // Admin ဖြစ်ပါက Ban Screen မပြစေဘဲ အမြဲ ခွင့်ပြုမည်
        if (res.status === 403 && String(user.id) !== ADMIN_USER_ID) {
          document.getElementById("mainApp").style.display = "none";
          document.getElementById("bannedScreen").style.display = "block";
          return;
        }
        const data = await res.json();
        if (data.status === "success") {
          points = data.points;
          MIN_POINTS = data.min_withdraw;
          TON_RATE = data.ton_rate;
          DAILY_LIMIT = data.daily_limit;
          AD_REWARD = data.ad_reward;
          REF_REWARD = data.ref_reward;

          document.getElementById("minText").innerText = `Min: ${MIN_POINTS} Pts`;
          document.getElementById("adBtn").innerText = `🎬 Watch Ad (+${AD_REWARD} Points)`;
          document.getElementById("refRewText").innerText = `+${REF_REWARD} Pts`;
          updateUI();
        }
      } catch (err) {
        console.log("Sync status:", err);
      }
    }

    function updateUI() {
      document.getElementById("points").innerText = points;
      document.getElementById("tonEst").innerText = `≈ ${(points * TON_RATE).toFixed(4)} TON`;
      document.getElementById("dailyLimitText").innerText = `Daily Ads: ${dailyData.count} / ${DAILY_LIMIT}`;
    }

    loadData();

    function shareInviteLink() {
      const inviteUrl = `https://t.me/Iceads_bot?start=ref_${user.id}`;
      const text = encodeURIComponent("🎬 Ads ကြည့်ပြီး TON ရှာကြမယ်!");
      const shareUrl = `https://t.me/share/url?url=${inviteUrl}&text=${text}`;
      if (tg) tg.openTelegramLink(shareUrl);
      else window.open(shareUrl, "_blank");
    }

    async function watchAd() {
      if (dailyData.count >= DAILY_LIMIT) {
        tg?.showAlert ? tg.showAlert(`ဒီနေ့အတွက် အကြိမ် ${DAILY_LIMIT} ပြည့်သွားပါပြီ။`) : alert("Limit reached");
        return;
      }

      const btn = document.getElementById("adBtn");
      btn.disabled = true;

      try {
        if (!window.Adsgram) throw new Error("Ads SDK Not Loaded");
        const AdController = window.Adsgram.init({ blockId: "57762" });
        await AdController.show();

        const res = await apiFetch(`/api/add_ad_points`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: user.id })
        });
        const resData = await res.json();
        points = resData.new_points || (points + AD_REWARD);
        dailyData.count += 1;
        localStorage.setItem("ice_daily", JSON.stringify(dailyData));
        updateUI();

        tg?.showAlert ? tg.showAlert(`🎉 +${AD_REWARD} Points ရရှိပါသည်!`) : alert(`🎉 +${AD_REWARD} Points ရရှိပါသည်!`);
      } catch (err) {
        alert("Ad status: " + (err.message || "Unavailable"));
      } finally {
        btn.disabled = false;
      }
    }

    async function requestWithdraw() {
      const address = document.getElementById("walletAddress").value.trim();
      const amountInput = parseInt(document.getElementById("withdrawPoints").value);

      if (!address || address.length < 20) {
        alert("ကျေးဇူးပြု၍ TON Address အပြည့်အစုံ ရိုက်ထည့်ပါ။");
        return;
      }

      if (isNaN(amountInput) || amountInput < MIN_POINTS) {
        alert(`အနည်းဆုံး ${MIN_POINTS} Points စတင် ထုတ်ယူရပါမည်။`);
        return;
      }

      if (amountInput > points) {
        alert("လက်ကျန် Points မလုံလောက်ပါ။");
        return;
      }

      const btn = document.getElementById("withdrawBtn");
      btn.disabled = true;

      try {
        const res = await apiFetch(`/api/withdraw`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: user.id,
            name: user.first_name,
            username: user.username,
            points: amountInput,
            address: address
          })
        });

        const data = await res.json();
        if (data.status === "success") {
          points = data.new_points;
          updateUI();
          document.getElementById("walletAddress").value = "";
          document.getElementById("withdrawPoints").value = "";
          alert("✅ ငွေထုတ်ယူခွင့် တောင်းဆိုမှု ပြေစာ ပေးပို့ပြီးပါပြီ။");
        } else {
          alert("Error: " + data.message);
        }
      } catch (e) {
        alert("ဆာဗာ ချိတ်ဆက်မရပါ: " + e.message);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
